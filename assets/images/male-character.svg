<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 500" width="100%" height="100%">
  <defs>
    <linearGradient id="m-suit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c3e50"/>
      <stop offset="100%" stop-color="#1a252f"/>
    </linearGradient>

    <linearGradient id="m-skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffeedd"/>
      <stop offset="100%" stop-color="#f3d0b8"/>
    </linearGradient>

    <linearGradient id="m-hair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a3728"/>
      <stop offset="100%" stop-color="#211710"/>
    </linearGradient>

    <linearGradient id="m-gift-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff3a1"/>
      <stop offset="50%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#cc9900"/>
    </linearGradient>

    <radialGradient id="ground-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(0,0,0,0.6)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#ffd700" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="160" cy="475" rx="100" ry="18" fill="url(#ground-shadow)"/>

  <g filter="url(#soft-glow)">
    <!-- Legs / Pants -->
    <rect x="122" y="340" width="30" height="120" rx="12" fill="#1a252f"/>
    <rect x="168" y="340" width="30" height="120" rx="12" fill="#1a252f"/>
    <!-- Leather Shoes -->
    <path d="M 112,455 Q 137,450 152,460 L 152,472 L 112,472 Z" fill="#0d1117"/>
    <path d="M 168,460 Q 183,450 208,455 L 208,472 L 168,472 Z" fill="#0d1117"/>

    <!-- Suit Torso -->
    <path d="M 90,165 Q 160,150 230,165 L 215,345 L 105,345 Z" fill="url(#m-suit)"/>
    
    <!-- White Shirt & Tie -->
    <polygon points="142,165 178,165 160,230" fill="#ffffff"/>
    <polygon points="154,168 166,168 160,215" fill="#e74c3c"/>

    <!-- Arms Presenting Gift Box -->
    <path d="M 95,170 Q 60,225 145,255" fill="none" stroke="url(#m-suit)" stroke-width="26" stroke-linecap="round"/>
    <path d="M 225,170 Q 260,225 175,255" fill="none" stroke="url(#m-suit)" stroke-width="26" stroke-linecap="round"/>

    <!-- Hands & Small Gift Box held by Male -->
    <rect x="135" y="235" width="50" height="40" rx="6" fill="#e74c3c"/>
    <rect x="156" y="235" width="8" height="40" fill="url(#m-gift-gold)"/>
    <circle cx="138" cy="255" r="12" fill="url(#m-skin)"/>
    <circle cx="182" cy="255" r="12" fill="url(#m-skin)"/>

    <!-- Neck -->
    <rect x="148" y="130" width="24" height="32" fill="url(#m-skin)"/>

    <!-- Head -->
    <ellipse cx="160" cy="95" rx="42" ry="46" fill="url(#m-skin)"/>

    <!-- Ears -->
    <ellipse cx="116" cy="97" rx="8" ry="11" fill="url(#m-skin)"/>
    <ellipse cx="204" cy="97" rx="8" ry="11" fill="url(#m-skin)"/>

    <!-- Stylish Hair -->
    <path d="M 114,85 C 110,35 210,35 206,85 C 195,55 125,55 114,85 Z" fill="url(#m-hair)"/>
    <path d="M 116,75 Q 160,35 204,70 Q 160,50 116,75 Z" fill="url(#m-hair)"/>
    <path d="M 135,80 Q 150,100 165,80 Z" fill="url(#m-hair)"/>

    <!-- Expressive Anime Eyes -->
    <ellipse cx="142" cy="97" rx="7" ry="10" fill="#2c3e50"/>
    <ellipse cx="178" cy="97" rx="7" ry="10" fill="#2c3e50"/>
    <circle cx="140" cy="93" r="3" fill="#ffffff"/>
    <circle cx="176" cy="93" r="3" fill="#ffffff"/>
    
    <!-- Blush & Smile -->
    <ellipse cx="132" cy="110" rx="8" ry="4.5" fill="#ff758c" opacity="0.5"/>
    <ellipse cx="188" cy="110" rx="8" ry="4.5" fill="#ff758c" opacity="0.5"/>
    <path d="M 148,115 Q 160,128 172,115" fill="none" stroke="#e74c3c" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
