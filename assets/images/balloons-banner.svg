<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <defs>
    <!-- Balloon Gradients -->
    <linearGradient id="bal-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff3a1"/>
      <stop offset="50%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
    
    <linearGradient id="bal-pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb6c1"/>
      <stop offset="50%" stop-color="#ff758c"/>
      <stop offset="100%" stop-color="#c71585"/>
    </linearGradient>

    <linearGradient id="bal-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d8bfd8"/>
      <stop offset="50%" stop-color="#9370db"/>
      <stop offset="100%" stop-color="#4b0082"/>
    </linearGradient>

    <linearGradient id="string-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,215,0,0.8)"/>
      <stop offset="100%" stop-color="rgba(255,215,0,0.1)"/>
    </linearGradient>

    <filter id="glow-effect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Banner Hanging String -->
  <path d="M 30,50 Q 400,120 770,50" fill="none" stroke="url(#string-grad)" stroke-width="3" stroke-dasharray="6,4"/>

  <!-- Balloons Cluster Left -->
  <g transform="translate(60, 20)">
    <ellipse cx="20" cy="40" rx="22" ry="28" fill="url(#bal-pink)" filter="url(#glow-effect)"/>
    <polygon points="20,68 16,74 24,74" fill="#ff758c"/>
    <ellipse cx="14" cy="30" rx="5" ry="8" fill="#ffffff" opacity="0.6"/>
  </g>
  <g transform="translate(100, 10)">
    <ellipse cx="20" cy="40" rx="25" ry="32" fill="url(#bal-gold)" filter="url(#glow-effect)"/>
    <polygon points="20,72 16,78 24,78" fill="#ffd700"/>
    <ellipse cx="12" cy="28" rx="6" ry="10" fill="#ffffff" opacity="0.7"/>
  </g>

  <!-- Happy Birthday Typography Art -->
  <g transform="translate(400, 75)" text-anchor="middle">
    <text x="0" y="0" font-family="'Playfair Display', Georgia, serif" font-size="42" font-weight="900" fill="url(#bal-gold)" letter-spacing="4" filter="url(#glow-effect)">
      HAPPY BIRTHDAY
    </text>
    <text x="0" y="32" font-family="'Dancing Script', cursive" font-size="28" font-weight="700" fill="#ff758c" letter-spacing="2">
      ✨ Chúc Mừng Sinh Nhật ✨
    </text>
  </g>

  <!-- Balloons Cluster Right -->
  <g transform="translate(660, 10)">
    <ellipse cx="20" cy="40" rx="25" ry="32" fill="url(#bal-gold)" filter="url(#glow-effect)"/>
    <polygon points="20,72 16,78 24,78" fill="#ffd700"/>
    <ellipse cx="12" cy="28" rx="6" ry="10" fill="#ffffff" opacity="0.7"/>
  </g>
  <g transform="translate(700, 25)">
    <ellipse cx="20" cy="40" rx="22" ry="28" fill="url(#bal-purple)" filter="url(#glow-effect)"/>
    <polygon points="20,68 16,74 24,74" fill="#9370db"/>
    <ellipse cx="14" cy="30" rx="5" ry="8" fill="#ffffff" opacity="0.6"/>
  </g>
</svg>
