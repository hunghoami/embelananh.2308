<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 500" width="100%" height="100%">
  <defs>
    <linearGradient id="f-dress" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff758c"/>
      <stop offset="50%" stop-color="#ff4757"/>
      <stop offset="100%" stop-color="#c0392b"/>
    </linearGradient>

    <linearGradient id="f-skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffe3d9"/>
    </linearGradient>

    <linearGradient id="f-hair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9a9e"/>
      <stop offset="100%" stop-color="#d63031"/>
    </linearGradient>

    <radialGradient id="f-ground-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(0,0,0,0.6)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>

    <filter id="f-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#ff758c" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="160" cy="475" rx="100" ry="18" fill="url(#f-ground-shadow)"/>

  <g filter="url(#f-glow)">
    <!-- Hair Back Flowing Layers -->
    <path d="M 80,75 Q 30,160 60,250 Q 100,200 95,100 Z" fill="url(#f-hair)"/>
    <path d="M 240,75 Q 290,160 260,250 Q 220,200 225,100 Z" fill="url(#f-hair)"/>

    <!-- Legs & Elegant Shoes -->
    <rect x="132" y="340" width="22" height="120" rx="11" fill="url(#f-skin)"/>
    <rect x="166" y="340" width="22" height="120" rx="11" fill="url(#f-skin)"/>
    <ellipse cx="141" cy="460" rx="16" ry="10" fill="#c0392b"/>
    <ellipse cx="179" cy="460" rx="16" ry="10" fill="#c0392b"/>

    <!-- Romantic Flouncy Dress -->
    <path d="M 120,165 Q 160,150 200,165 L 245,340 L 75,340 Z" fill="url(#f-dress)"/>
    <path d="M 75,340 Q 90,355 105,340 Q 120,355 135,340 Q 150,355 165,340 Q 180,355 195,340 Q 210,355 225,340 Q 240,355 245,340 Z" fill="#ffffff"/>

    <!-- Joyful Hands Raised to Chest -->
    <path d="M 115,170 Q 85,215 125,235" fill="none" stroke="url(#f-skin)" stroke-width="20" stroke-linecap="round"/>
    <path d="M 205,170 Q 235,215 195,235" fill="none" stroke="url(#f-skin)" stroke-width="20" stroke-linecap="round"/>

    <!-- Neck -->
    <rect x="150" y="130" width="20" height="30" fill="url(#f-skin)"/>

    <!-- Head -->
    <ellipse cx="160" cy="95" rx="42" ry="46" fill="url(#f-skin)"/>

    <!-- Ears & Gold Earrings -->
    <ellipse cx="116" cy="97" rx="7" ry="10" fill="url(#f-skin)"/>
    <ellipse cx="204" cy="97" rx="7" ry="10" fill="url(#f-skin)"/>
    <circle cx="116" cy="110" r="4" fill="#ffd700"/>
    <circle cx="204" cy="110" r="4" fill="#ffd700"/>

    <!-- Front Bangs & Yellow Bow Clips -->
    <path d="M 116,78 Q 160,45 204,78 Q 190,110 200,125 Q 160,80 116,78 Z" fill="url(#f-hair)"/>
    <path d="M 116,78 Q 130,110 120,125 Q 150,80 204,78 Z" fill="url(#f-hair)"/>
    <path d="M 110,65 L 125,55 L 125,75 Z" fill="#ffd700"/>
    <path d="M 210,65 L 195,55 L 195,75 Z" fill="#ffd700"/>

    <!-- Anime Sparkly Eyes -->
    <ellipse cx="142" cy="97" rx="7.5" ry="11" fill="#2c3e50"/>
    <ellipse cx="178" cy="97" rx="7.5" ry="11" fill="#2c3e50"/>
    <circle cx="140" cy="92" r="3.5" fill="#ffffff"/>
    <circle cx="176" cy="92" r="3.5" fill="#ffffff"/>
    <circle cx="144" cy="100" r="1.8" fill="#ffffff"/>
    <circle cx="180" cy="100" r="1.8" fill="#ffffff"/>

    <!-- Rosy Blush & Joyful Smile -->
    <ellipse cx="132" cy="110" rx="9" ry="5" fill="#ff758c" opacity="0.7"/>
    <ellipse cx="188" cy="110" rx="9" ry="5" fill="#ff758c" opacity="0.7"/>
    <path d="M 146,114 Q 160,130 174,114 Z" fill="#c0392b"/>
  </g>
</svg>
